services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=coCreate
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://host.docker.internal:27017/coCreate
      - JWT_SECRET_KEY=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiIsImlhdCI6MTc0MDEyNzUxMSwiZXhwIjoxNzQwMTMxMTExfQ.iSKXTwzx6kxzMVFYxjSGULeq308mS1Ngi9tFuGyTtZk
    depends_on:
      - mongo

  frontend:
    build:
      context: ./svelte
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://backend:8080/api
    depends_on:
      - backendm,                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  

volumes:
  mongo_data: